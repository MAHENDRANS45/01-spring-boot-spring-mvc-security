<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Custom Login Page</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <h3>Custom Login Page</h3>

    <form action="#" th:action="@{/authenticateTheUser}" method="POST">

        <!-- Check for login error -->
        <div th:if="${param.error}" >
                <i class="error">Sorry! You entered invalid username/password</i>
        </div>

        <p>
            User Name: <input type="text" name="username" /> <!--have to use this name-->
        </p>

        <p>
            Password: <input type="text" name="password" /> <!--have to use this name-->
        </p>

        <input type="submit" value="Login"/>

    </form>


</body>
</html>
