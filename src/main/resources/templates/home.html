<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity">

<head>
    <meta charset="UTF-8">
    <title>Company Home Page</title>
</head>

<body>
    <h2>Company Home Page</h2>
    <hr>
    Welcome to the company home page!
    <hr>

    <!-- display user name and role -->

    <p>
        User: <span sec:authentication="principal.username"></span><br><br>
        Role(s): <span sec:authentication="principal.authorities"></span><br><br>
    </p>

    <!-- This div will only be rendered for managers -->
    <div sec:authorize="hasRole('MANAGER')">
        <!-- Add a link to point to /leaders ... this is for managers -->
        <p>
            <a th:href="@{/leaders}">Leadership Meeting</a>
            (Only for Manager peeps)
        </p>
    </div>

    <!-- This div will only be rendered for admins -->
    <div sec:authorize="hasRole('ADMIN')">
        <!-- Add a link to point to /Systems ... this is for admins -->
        <p>
            <a th:href="@{/systems}">IT Systems Meeting</a>
            (Only for Admin peeps)
        </p>
    </div>

    <!-- Add a logout button -->
    <form action="#" th:action="@{/logout}" method="POST">
        <input type="submit" value="Logout"/>
    </form>

</body>

</html>
